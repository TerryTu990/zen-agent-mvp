<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Zen Agent 配置中心</title>
  <style>
    /* 语义令牌层（DESIGN.md 为取值与视觉语言 SSOT）：界面样式只消费本层，不写原始值。 */
    :root {
      color-scheme: light;
      --ink: #1c1b18;
      --ink-2: #615c54;
      --muted: #8e887d;
      --paper: #f4f3ef;
      --surface: #fbfaf8;
      --raised: #edeae2;
      --line: #e6e2da;
      --line-strong: #d6d0c4;
      --clay: #b4552f;
      --clay-deep: #9c471f;
      --auto: #3e6b4e; --auto-bg: #e7eee8;
      --hitl: #8f6516; --hitl-bg: #f7f0e2; --hitl-line: #e3d3ad;
      --off: #a23a2c; --off-bg: #f5e4e0; --off-line: #e6c8c0;
      --radius-sm: 6px;
      --radius: 10px;
      --radius-lg: 14px;
      --serif: Fraunces, "Iowan Old Style", "Songti SC", "Noto Serif SC", Georgia, serif;
      --sans: "Hanken Grotesk", "Avenir Next", "PingFang SC", "Noto Sans SC", sans-serif;
      --mono: "Geist Mono", "SFMono-Regular", "Noto Sans Mono", Menlo, monospace;
      --ease: cubic-bezier(.16, 1, .3, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      font-family: var(--sans);
      background: var(--paper); color: var(--ink);
      font-size: 14px; line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; color: inherit; }

    /* ---- 骨架：左侧固定导航 + 单列阅读宽度内容区 ---- */

    .za-cc { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }

    .za-cc-nav {
      position: sticky; top: 0; align-self: start;
      height: 100vh; padding: 24px 12px;
      display: flex; flex-direction: column; gap: 20px;
      border-right: 1px solid var(--line); background: var(--surface);
    }
    .za-cc-brand { display: flex; align-items: center; gap: 10px; padding: 0 10px; }
    .za-cc-brand-mark { width: 24px; height: 24px; flex: 0 0 auto; }
    .za-cc-logo { font: 500 17px/1.2 var(--serif); letter-spacing: -.01em; }
    .za-cc-logo-sub {
      margin-top: 3px; color: var(--ink-2);
      font: 500 10.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase;
    }
    .za-cc-nav-list { display: flex; flex-direction: column; gap: 2px; }
    .za-cc-nav-item {
      display: block; width: 100%; text-align: left;
      padding: 8px 10px; border: 0; border-radius: var(--radius-sm);
      background: none; color: var(--ink-2); font-size: 13px; font-weight: 500; cursor: pointer;
    }
    .za-cc-nav-item:hover { background: var(--raised); color: var(--ink); }
    .za-cc-nav-item-active,
    .za-cc-nav-item-active:hover { background: var(--raised); color: var(--ink); font-weight: 600; }

    .za-cc-main { min-width: 0; padding: 0 40px; display: flex; flex-direction: column; }
    .za-cc-panel, .za-cc-footer { width: 100%; max-width: 768px; margin: 0 auto; }
    .za-cc-panel { display: flex; flex-direction: column; gap: 16px; padding: 40px 0 32px; }

    /* ---- 页标题 ---- */

    .za-cc-page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .za-cc-page-title { font: 500 24px/1.2 var(--serif); letter-spacing: -.01em; }
    .za-cc-page-sub { margin-top: 4px; color: var(--ink-2); font-size: 13px; }
    .za-cc-head-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding-top: 4px; }

    /* ---- 按钮与控件 ---- */

    .za-cc-btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 30px; padding: 5px 12px;
      border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 500;
      white-space: nowrap; cursor: pointer;
    }
    .za-cc-btn:hover:not(:disabled) { border-color: var(--ink-2); background: var(--raised); }
    .za-cc-btn-primary { border-color: var(--clay); background: var(--clay); color: var(--surface); }
    .za-cc-btn-primary:hover:not(:disabled) { border-color: var(--clay-deep); background: var(--clay-deep); }
    .za-cc-btn-danger { color: var(--off); }
    .za-cc-btn-danger:hover:not(:disabled) { border-color: var(--off); background: var(--off-bg); }
    .za-cc-unavailable { border-style: dashed; background: none; color: var(--muted); cursor: not-allowed; }

    :focus-visible { outline: 2px solid var(--clay); outline-offset: 2px; }

    .za-cc-input, .za-cc-textarea, select,
    input[type="text"], input[type="url"], input[type="number"] {
      min-height: 30px; padding: 5px 9px;
      border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--ink); font-size: 13px;
    }
    .za-cc-input:hover, .za-cc-textarea:hover, select:hover,
    input[type="text"]:hover, input[type="url"]:hover, input[type="number"]:hover { border-color: var(--ink-2); }
    .za-cc-input::placeholder, .za-cc-textarea::placeholder { color: var(--ink-2); }
    .za-cc-input { width: 100%; }
    .za-cc-textarea { width: 100%; resize: vertical; line-height: 1.5; }
    input[type="number"] { width: 84px; }
    select { min-width: 96px; padding-right: 6px; }

    /* 开关：34×19，开=clay（全页一致）；::before 把热区扩到 ≥24px（WCAG 2.2 Target Size）。 */
    input[type="checkbox"] {
      position: relative; flex: 0 0 auto; appearance: none; -webkit-appearance: none;
      width: 34px; height: 19px;
      border: 1px solid var(--line-strong); border-radius: 999px;
      background: var(--raised); cursor: pointer;
    }
    input[type="checkbox"]::before { content: ""; position: absolute; inset: -4px -2px; }
    input[type="checkbox"]::after {
      content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px;
      border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(28, 27, 24, .22);
    }
    input[type="checkbox"]:checked { border-color: var(--clay); background: var(--clay); }
    input[type="checkbox"]:checked::after { transform: translateX(15px); }

    .za-cc-switch { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; cursor: pointer; }
    .za-cc-switch-text { user-select: none; }

    .za-cc-field { display: flex; flex-direction: column; gap: 6px; }
    .za-cc-field-head { display: flex; align-items: center; gap: 8px; }
    .za-cc-field-inline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .za-cc-label { font-size: 13px; font-weight: 600; }
    .za-cc-identity {
      padding: 4px 8px; border: 1px solid var(--line); border-radius: var(--radius-sm);
      background: var(--paper); font: 12px/1.5 var(--mono);
    }

    /* ---- 卡片与分区 ---- */

    .za-cc-pack, .za-cc-section, .za-cc-scope {
      padding: 18px 20px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface);
    }
    .za-cc-section-title, .za-cc-scope-title { font-size: 15px; font-weight: 600; }
    .za-cc-section > .za-cc-section-title { margin-bottom: 4px; }
    .za-cc-section > .za-cc-section-title + .za-cc-hint { display: block; margin-bottom: 12px; }
    .za-cc-scope > .za-cc-section {
      padding: 16px 0 0; margin-top: 16px;
      border: 0; border-top: 1px solid var(--line); border-radius: 0; background: none;
    }
    .za-cc-scope-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .za-cc-scope-note { color: var(--ink-2); font-size: 13px; }

    .za-cc-hint { color: var(--ink-2); font-size: 12px; line-height: 1.5; }
    .za-cc-empty {
      padding: 14px 16px; border: 1px dashed var(--line-strong); border-radius: var(--radius);
      color: var(--ink-2); font-size: 13px;
    }
    .za-cc-notice { padding: 10px 14px; border-radius: var(--radius); font-size: 13px; line-height: 1.55; }
    .za-cc-notice-info { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); }
    .za-cc-notice-warn { border: 1px solid var(--hitl-line); background: var(--hitl-bg); color: var(--hitl); }
    .za-cc-notice-lock { border: 1px solid var(--line-strong); background: var(--paper); color: var(--ink-2); }

    /* ---- 徽章：11px 全圆角；颜色只表达治理语义，来源分层靠字重与描边 ---- */

    .za-cc-badge {
      display: inline-block; padding: 2px 8px; border: 1px solid var(--line-strong); border-radius: 999px;
      background: var(--surface); color: var(--ink-2); font-size: 11px; line-height: 1.5;
      white-space: nowrap; vertical-align: middle;
    }
    .za-cc-badge-official { border-color: var(--ink); background: var(--ink); color: var(--surface); }
    .za-cc-badge-local { border-style: dashed; }
    .za-cc-badge-origin { border-color: var(--line); background: var(--paper); }
    .za-cc-badge-tight, .za-cc-badge-paused { border-color: var(--hitl-line); background: var(--hitl-bg); color: var(--hitl); }
    .za-cc-badge-warn { border-color: var(--off-line); background: var(--off-bg); color: var(--off); }

    /* ---- 站点包页 ---- */

    .za-cc-pack { display: flex; flex-direction: column; gap: 8px; }
    .za-cc-pack-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .za-cc-pack-name { font-size: 15px; font-weight: 600; }
    .za-cc-pack-version { color: var(--ink-2); font: 12px/1.5 var(--mono); }
    .za-cc-pack-row .za-cc-switch { margin-left: auto; }
    .za-cc-pack-meta {
      display: flex; align-items: center; gap: 4px 14px; flex-wrap: wrap;
      color: var(--ink-2); font-size: 12px;
    }
    .za-cc-pack-origin, .za-cc-pack-locations { font: 12px/1.5 var(--mono); }
    .za-cc-pack-desc { color: var(--ink-2); font-size: 13px; }
    .za-cc-pack-ops { display: flex; gap: 8px; margin-top: 4px; }

    /* ---- 行式设置项：左=标签与说明，右=控件 ---- */

    .za-cc-rule, .za-cc-fact, .za-cc-quick-action, .za-cc-automation, .za-cc-watch,
    .za-cc-site-deny-entry, .za-cc-site-grant-entry {
      display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap;
      padding: 12px 0; border-top: 1px solid var(--line);
    }
    .za-cc-section > .za-cc-hint + .za-cc-rule,
    .za-cc-section > .za-cc-hint + .za-cc-fact,
    .za-cc-section > .za-cc-hint + .za-cc-quick-action,
    .za-cc-section > .za-cc-hint + .za-cc-watch,
    .za-cc-section > .za-cc-section-title + .za-cc-rule,
    .za-cc-section > .za-cc-section-title + .za-cc-fact,
    .za-cc-section > .za-cc-section-title + .za-cc-automation { border-top: 0; padding-top: 4px; }

    .za-cc-rule-text, .za-cc-fact-text { flex: 1 1 240px; font-size: 13px; }
    .za-cc-rule-scope, .za-cc-fact-scope { color: var(--ink-2); font-size: 12px; }
    .za-cc-rule-created, .za-cc-fact-created { color: var(--ink-2); font: 12px/1.5 var(--mono); }
    .za-cc-rule-delete, .za-cc-fact-delete { margin-left: auto; }

    .za-cc-quick-action-label { font-size: 13px; font-weight: 600; }
    .za-cc-quick-action-context { color: var(--ink-2); font-size: 12px; }
    .za-cc-quick-action-delete { order: 2; margin-left: auto; }
    .za-cc-quick-action-template {
      order: 3; flex-basis: 100%; min-width: 0;
      padding: 6px 9px; border-radius: var(--radius-sm); background: var(--paper);
      color: var(--ink-2); font: 12px/1.5 var(--mono);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .za-cc-quick-action-form {
      display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
      margin-top: 14px; padding: 14px; border: 1px dashed var(--line-strong); border-radius: var(--radius);
    }
    .za-cc-qa-fields { display: flex; align-items: center; gap: 8px; width: 100%; min-width: 0; }
    .za-cc-qa-fields .za-cc-input { flex: 1 1 auto; min-width: 0; }
    .za-cc-qa-fields select { flex: 0 0 auto; }
    .za-cc-quick-action-issue { color: var(--off); font-size: 12px; }
    .za-cc-quick-action-issue:empty { display: none; }

    /* ---- 工具权限矩阵 ---- */

    .za-cc-matrix-scroll { overflow-x: auto; }
    .za-cc-matrix { width: 100%; border-collapse: collapse; }
    .za-cc-matrix th {
      padding: 0 10px 8px 0; border-bottom: 1px solid var(--line-strong);
      color: var(--ink-2); font: 500 10.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase;
      text-align: left; white-space: nowrap;
    }
    .za-cc-matrix th:last-child, .za-cc-matrix td:last-child { padding-right: 0; text-align: right; }
    .za-cc-matrix td { padding: 12px 10px; padding-left: 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
    .za-cc-matrix tr:last-child td { border-bottom: 0; padding-bottom: 0; }
    .za-cc-tool-name { display: block; font: 500 12px/1.5 var(--mono); }
    /* 工具描述常达数百字：视觉截三行（文本仍在 DOM 与无障碍树内，完整内容经 title 可读）。 */
    .za-cc-tool-desc {
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden;
      margin-top: 2px; color: var(--ink-2); font-size: 12px; line-height: 1.45;
    }
    .za-cc-tool-base { font-size: 12px; white-space: nowrap; }
    .za-cc-tool-base[data-za-tier="auto"] { color: var(--auto); }
    .za-cc-tool-base[data-za-tier="hitl"] { color: var(--hitl); }
    .za-cc-tool-base[data-za-tier="forbidden"] { color: var(--off); }
    .za-cc-tier { min-height: 28px; }
    .za-cc-tier[data-za-tier="auto"] { color: var(--auto); }
    .za-cc-tier[data-za-tier="hitl"] { color: var(--hitl); }
    .za-cc-tier[data-za-tier="forbidden"] { color: var(--off); }
    .za-cc-matrix td:last-child .za-cc-badge { margin-left: 8px; }

    /* ---- 自动化行 ---- */

    .za-cc-automation, .za-cc-watch { flex-direction: column; align-items: stretch; gap: 10px; }
    .za-cc-row-main { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
    .za-cc-row-main .za-cc-switch { margin-left: auto; }
    .za-cc-automation-name { font-size: 13px; font-weight: 600; }
    .za-cc-row-fields { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; }
    .za-cc-row-fields .za-cc-field-inline { flex: 1 1 auto; gap: 8px; color: var(--ink-2); font-size: 12px; }
    .za-cc-watch-url { min-width: 220px; flex: 1 1 220px; }
    .za-cc-watch-focus { min-width: 160px; flex: 1 1 160px; }
    .za-cc-row-notes { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; }
    .za-cc-row-notes .za-cc-hint { flex: 1 1 220px; }
    .za-cc-watch-foreign .za-cc-row-main { color: var(--ink-2); }

    /* ---- 全局设置页 ---- */

    .za-cc-setting {
      display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
      padding: 12px 0; border-top: 1px solid var(--line);
    }
    .za-cc-section > .za-cc-section-title + .za-cc-setting,
    .za-cc-section > .za-cc-field + .za-cc-setting { border-top: 0; padding-top: 4px; }
    .za-cc-setting-copy { flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .za-cc-setting-control { flex: 0 0 auto; }
    .za-cc-setting-control select { min-width: 180px; }
    .za-cc-section > .za-cc-field + .za-cc-field { margin-top: 16px; }

    .za-cc-site-deny-text, .za-cc-site-grant-text { flex: 1 1 200px; font: 12px/1.5 var(--mono); }
    .za-cc-site-deny-remove, .za-cc-site-grant-remove { margin-left: auto; }
    .za-cc-site-deny > .za-cc-field-inline, .za-cc-site-grant > .za-cc-field-inline { margin-top: 14px; }
    .za-cc-site-deny-input, .za-cc-site-grant-input { min-width: 220px; flex: 1 1 220px; }
    .za-cc-site-deny > .za-cc-hint:last-child { display: block; margin-top: 8px; }

    .za-cc-pending-row, .za-cc-lock-row {
      display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line);
    }
    .za-cc-section > .za-cc-section-title + .za-cc-pending-row,
    .za-cc-section > .za-cc-section-title + .za-cc-lock-row { border-top: 0; padding-top: 4px; }
    .za-cc-section-locked { background: var(--paper); }
    .za-cc-lock-name { font-size: 13px; }
    .za-cc-lock-tag {
      margin-left: auto; color: var(--ink-2);
      font: 500 10.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase;
    }
    .za-cc-section-locked > .za-cc-hint:last-child { display: block; margin-top: 12px; }

    /* ---- 粘性保存栏 ---- */

    .za-cc-footer {
      position: sticky; bottom: 0; z-index: 1;
      display: flex; align-items: center; gap: 14px;
      margin-top: auto; padding: 14px 0;
      border-top: 1px solid var(--line-strong); background: var(--paper);
    }
    .za-cc-status { flex: 1 1 auto; min-width: 0; color: var(--auto); font-size: 12px; line-height: 1.5; }
    .za-cc-status-err { color: var(--off); }
    .za-cc-revision { flex: 0 0 auto; color: var(--ink-2); font: 11px/1.5 var(--mono); }

    @media (prefers-reduced-motion: no-preference) {
      .za-cc-nav-item, .za-cc-btn, .za-cc-input, .za-cc-textarea, select,
      input[type="text"], input[type="url"], input[type="number"] {
        transition: background 160ms var(--ease), border-color 160ms var(--ease), color 160ms var(--ease);
      }
      input[type="checkbox"] { transition: background 160ms var(--ease), border-color 160ms var(--ease); }
      input[type="checkbox"]::after { transition: transform 160ms var(--ease); }
    }
  </style>
</head>
<body>
  <main id="za-config-center"></main>
  <script src="dist/options.js"></script>
</body>
</html>
